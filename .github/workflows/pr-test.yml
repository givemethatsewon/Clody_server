name: Run Tests on Changed Modules

on:
  pull_request:
    branches: [ prod ]

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - uses: actions/setup-java@v3
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: 21

      - name: Cache Gradle packages
        uses: actions/cache@v4               
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          
      - name: Detect changed modules
        id: changed_modules
        shell: bash
        run: |
          # git diff 대상이 origin/prod 인지, HEAD~1 인지 확인
          BASE_REF=$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
          MODULES=$(git diff --name-only "$BASE_REF"...HEAD | cut -d'/' -f1 | sort -u)
          echo "modules=$MODULES" | tee -a $GITHUB_OUTPUT

      - name: Run tests on changed modules
        if: steps.changed_modules.outputs.modules != ''
        run: |
          for module in ${{ steps.changed_modules.outputs.modules }}; do
            echo ">>> Running tests for $module"
            ./gradlew --info :$module:test
          done

      - name: Skip message
        if: steps.changed_modules.outputs.modules == ''
        run: echo "No module changes detected – skipping module-specific tests."

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/build/test-results/**/*.xml'
