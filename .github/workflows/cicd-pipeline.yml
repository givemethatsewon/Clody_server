name: Prod CI-CD

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_LOGIN_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_LOGIN_ACCESSTOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make resource directories
        run: |
          mkdir -p clody-app/src/main/resources \
                   clody-domain/src/main/resources \
                   clody-infra/src/main/resources \
                   clody-support/src/main/resources/logback \
                   clody-batch/src/main/resources

      # 시크릿 파일 복원
      - name: Inject YAML / Etc resources
        env:
          APP_API:       ${{ secrets.APPLICATION_API_YML }}
          APP_INFRA:     ${{ secrets.APPLICATION_INFRA_YML }}
          APP_DOMAIN:    ${{ secrets.APPLICATION_DOMAIN_YML }}
          APP_SUPPORT:   ${{ secrets.APPLICATION_SUPPORT_YML }}
          APP_BATCH:     ${{ secrets.APPLICATION_BATCH_YML }}
          INSTRUCTION:   ${{ secrets.INSTRUCTION_TXT }}
          FIREBASE_KEY:  ${{ secrets.FIREBASE_JSON }}
          REPLY_YAML:    ${{ secrets.REPLY_YAML }}
          LOGBACK_XML:   ${{ secrets.LOGBACK_XML }}
        run: |
          echo "$APP_API"       > clody-app/src/main/resources/application-api.yml
          echo "$APP_DOMAIN"    > clody-domain/src/main/resources/application-domain.yml
          echo "$APP_INFRA"     > clody-infra/src/main/resources/application-infrastructure.yml
          echo "$APP_SUPPORT"   > clody-support/src/main/resources/application-support.yml
          echo "$APP_BATCH"     > clody-batch/src/main/resources/application-batch.yml

          echo "$INSTRUCTION"   > clody-infra/src/main/resources/instruction.txt
          echo "$FIREBASE_KEY"  > clody-infra/src/main/resources/firebase-adminsdk.json
          echo "$REPLY_YAML"    > clody-domain/src/main/resources/reply.yaml
          echo "$LOGBACK_XML"   > clody-support/src/main/resources/logback/logback-local-dev.xml

          chmod 600 $(git ls-files | grep -E 'src/main/resources/.*\.(yml|yaml|json|txt|xml)$')

      - name: Build bootJar
        run: ./gradlew :clody-app:bootJar --no-daemon

      - name: Login to DockerHub
        run: echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t $REGISTRY:latest .
          docker push  $REGISTRY:latest

      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            ~/deploy_prod.sh

      - name: Discord success
        if: success()
        uses: Ilshidur/action-discord@v2
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          message: ":white_check_mark: *${{ github.workflow }}* #${{ github.run_number }} succeeded in ${{ github.run_duration }}s."

      - name: Discord failure
        if: failure()
        uses: Ilshidur/action-discord@v2
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          message: ":x: *${{ github.workflow }}* #${{ github.run_number }} failed."
